name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Image repository under GHCR built for this repo.
# NOTE: registry names must be LOWERCASE. github.repository is `owner/DEVOPS_CIA_II`
# (uppercase) which buildx rejects, so we hardcode the lowercase GHCR package path.
env:
  APP_IMAGE: ghcr.io/karthikbaskar5455/devops_cia_ii/java-cicd-app

jobs:
  # ---------------- Stage 1: Checkout + Build + Test (Maven) ----------------
  build-and-test:
    name: Checkout, Build, Test (Maven)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile, package and run tests (mvn verify)
        run: mvn -B clean verify

      - name: Inspect the packaged jar
        run: ls -lh target/*.jar

      - name: Report unit test results
        run: cat target/surefire-reports/*.txt

      - name: Upload test reports as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Upload built jar as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/java-cicd-app.jar

  # ------------- Stage 2: Build + tag Docker image + push to registry ---------
  build-and-push-image:
    name: Build & Push Docker Image to GHCR
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # needed to push to GHCR
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: docker_build
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:${{ github.sha }}
            ${{ env.APP_IMAGE }}:latest

      - name: Echo pushed image tag
        run: echo "Pushed ${{ env.APP_IMAGE }}:${{ github.sha }}"

  # ---------------- Stage 3: Deploy to AKS via Ansible + kubectl -----------
  deploy:
    name: Deploy to AKS
    needs: build-and-push-image
    runs-on: ubuntu-latest
    # Gated by a repo VARIABLE (Settings > Actions > Variables ENABLE_DEPLOY).
    # Until that variable is set to 'true', this job is SKIPPED => pipeline is all-green
    # for the first (cloudless) run. Set ENABLE_DEPLOY=true only once AKS exists.
    if: vars.ENABLE_DEPLOY == 'true'
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Azure login (service principal)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: rg-cia2
          cluster-name: aks-cia2

      - name: Verify kubectl can reach the cluster
        run: kubectl version --client && kubectl get nodes

      - name: Install Ansible
        run: |
          pip install --user ansible-core
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Ansible deployment playbook
        run: |
          ansible-playbook -i ansible/inventory \
            -e pipeline_image="${{ env.APP_IMAGE }}" \
            -e pipeline_tag="${{ github.sha }}" \
            ansible/playbook.yml

      - name: Show pods
        run: kubectl get pods -n devops-ns

      - name: Show service/endpoint
        run: kubectl get svc -n devops-ns

      - name: Summary
        run: |
          echo "::notice::Pipeline complete"
